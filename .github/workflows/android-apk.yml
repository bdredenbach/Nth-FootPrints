name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "package.json"
      - "tests/**"
      - "native/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run project tests
        run: npm test

      - name: Install Capacitor
        run: npm install --package-lock=false

      - name: Prepare bundled app
        run: |
          node --input-type=module <<'NODE'
          import {
            cpSync,
            readFileSync,
            writeFileSync
          } from "node:fs";

          cpSync("dist", "native-web", { recursive: true });

          const path = "native-web/app.js";
          const source = readFileSync(path, "utf8");
          const registration =
            "if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});";

          writeFileSync(path, source.replace(registration, ""));

          const htmlPath = "native-web/index.html";
          const html = readFileSync(htmlPath, "utf8");
          writeFileSync(htmlPath, html.replace(
            '<html lang="en">',
            '<html lang="en" class="native-app">'
          ).replace('<script type="module" src="app.js"></script>',
            '<script src="native-bridge.js"></script><script type="module" src="app.js"></script>'));

          writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.nthexperience.footprints",
            appName: "Nth FootPrints",
            webDir: "native-web",
            appendUserAgent: " NthFootPrints/0.3.2 (+https://github.com/bdredenbach/Nth-FootPrints)",
            plugins: {
              SystemBars: {
                insetsHandling: "css",
                style: "DARK",
                hidden: false,
                animation: "NONE"
              }
            }
          }, null, 2));
          NODE
          npx esbuild native/bridge.js --bundle --format=iife --outfile=native-web/native-bridge.js

      - name: Create Android project
        run: npx cap add android

      - name: Add Android file and widget bridges
        run: |
          cp native/android/*.java android/app/src/main/java/com/nthexperience/footprints/
          node native/prepare-widget.mjs

      - name: Set Android version
        run: |
          python3 - <<'PYVERSION'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          code = int(os.environ["GITHUB_RUN_NUMBER"])
          path = Path("android/app/build.gradle")
          source = re.sub(r"versionCode\s+\d+", f"versionCode {code}", path.read_text())
          source = re.sub(r'versionName\s+"[^"\n]+"', f'versionName "{version}"', source)
          path.write_text(source)
          PYVERSION

      - name: Declare device permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()

          permissions = [
              "CAMERA",
              "RECORD_AUDIO",
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
          ]

          for permission in permissions:
              entry = (
                  '<uses-permission android:name="android.permission.'
                  + permission + '" />\n'
              )
              source = source.replace(
                  "</manifest>", entry + "</manifest>"
              )

          path.write_text(source)
          PY

      - name: Install Android SDK packages
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: >
          cp android/app/build/outputs/apk/debug/app-debug.apk
          Nth-FootPrints-debug.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v7
        with:
          name: Nth-FootPrints-debug
          path: Nth-FootPrints-debug.apk
          if-no-files-found: error
          retention-days: 14
